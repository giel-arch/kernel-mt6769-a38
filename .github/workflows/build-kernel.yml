name: Build Custom Kernel OPPO A38

on:
  push:
    branches: [ "main", "master", "Linux-DownStream" ]
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    name: Build Kernel by Kuchiba
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        
    - name: Download Toolchain (AOSP Clang)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r510928.git $GITHUB_WORKSPACE/toolchain
        

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        export ARCH=arm64
        export CC=clang
        export LLVM=1
        export LLVM_IAS=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        echo -n "" > scripts/setlocalversion
        make O=out ARCH=arm64 oppo_a38_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- Image.gz modules
        
    - name: Upload Kernel Image and Modules
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Kuchiba-Chisa-Zestra-4k
        path: |
          out/arch/arm64/boot/Image.gz
          out/**/*.ko
        compression-level: 9
